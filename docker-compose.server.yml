# ─────────────────────────────────────────────────────────────────────────────
# Server override — for a single VPS with NO public domain yet.
#
# Use this INSTEAD of docker-compose.prod.yml until you point a domain at the
# server. It does three things differently from prod:
#   1. Skips the docker nginx (the host already has one — we'll attach later
#      when you take a domain).
#   2. Publishes each Next.js app + the API on a host port in the 8100-range
#      so it lives alongside the existing Odoo (8069), Postgres (5432), Redis
#      (6379) and host nginx (80) without colliding.
#   3. Bakes the public API URL into the bundles as http://<server-ip>:8100
#      so browsers can reach the API directly.
#
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
#
# Set PUBLIC_IP in your shell first:
#   export PUBLIC_IP=62.171.147.73
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./apps/api/.env.server
    # Override the hardcoded dev passwords/URLs baked into the base
    # docker-compose.yml. Compose merges `environment` blocks, and the
    # override file's values WIN — so this is how we replace `jmart_pass`
    # with the production secrets.
    environment:
      DATABASE_URL: postgresql://jmart_user:${DB_PASS:?missing DB_PASS}@postgres:5432/jmart_db?schema=public
      DATABASE_DIRECT_URL: postgresql://jmart_user:${DB_PASS}@postgres:5432/jmart_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASS:?missing REDIS_PASS}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_KEY:?missing MINIO_KEY}
      STORAGE_SECRET_KEY: ${MINIO_SECRET:?missing MINIO_SECRET}
      SMTP_HOST: ""
      SMTP_PORT: "587"
      NODE_ENV: production
    command: node dist/src/main.js
    # Drop the dev bind-mount (./apps/api:/app) and node_modules tmpfs from
    # the base file. Same `!reset []` pattern as ports — without it compose
    # MERGES the lists and the host-mounted /app shadows the built image's
    # /app/dist, so node can't find dist/src/main.js.
    volumes: !reset []
    ports:
      - '8100:3000'                # API
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://62.171.147.73:8100/api/v1}
    container_name: jmart_admin
    restart: unless-stopped
    ports:
      - '8102:3002'                # Admin
    depends_on:
      - api

  farmer:
    build:
      context: ./apps/farmer
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://62.171.147.73:8100/api/v1}
    container_name: jmart_farmer
    restart: unless-stopped
    ports:
      - '8103:3003'                # Farmer / Buyer portal
    depends_on:
      - api

  driver:
    build:
      context: ./apps/driver
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://62.171.147.73:8100/api/v1}
    container_name: jmart_driver
    restart: unless-stopped
    ports:
      - '8104:3004'                # Driver portal
    depends_on:
      - api

  # ─── Data plane: stays OFF the public internet ──────────────────────────
  # `!reset []` clears the ports list inherited from docker-compose.yml so
  # the data services are reachable ONLY inside the docker network — never
  # from the host IP. This is critical because the host already runs its
  # own postgres on 5432 and redis on 6379; without !reset, docker compose
  # MERGES the ports list and the container collides with the host services.
  # Passwords pulled from root .env (gitignored). Required: DB_PASS,
  # REDIS_PASS, MINIO_KEY, MINIO_SECRET.
  postgres:
    ports: !reset []
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASS:?missing DB_PASS in root .env}
      POSTGRES_USER: jmart_user
      POSTGRES_DB: jmart_db

  redis:
    ports: !reset []
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASS:?missing REDIS_PASS in root .env}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    ports: !reset []
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_KEY:?missing MINIO_KEY in root .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET:?missing MINIO_SECRET in root .env}

  # MailHog is dev-only — don't ship its port to production
  mailhog:
    ports: !reset []
    profiles: ["dev-only"]

  # The full prod compose has an nginx service; we disable it here by giving
  # it a profile that's never activated. The host's existing nginx will
  # reverse-proxy these ports later when you add a domain.
  nginx:
    profiles: ["with-docker-nginx"]
